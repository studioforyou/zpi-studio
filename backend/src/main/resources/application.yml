spring:
  profiles:
    group:
      # Test data (db/seed) is loaded on dev and stage only; any other profile, e.g. prod, gets none.
      dev: seed
      stage: seed
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firebase Authentication ID tokens of the project in FIREBASE_PROJECT_ID.
          issuer-uri: https://securetoken.google.com/${FIREBASE_PROJECT_ID}
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
          audiences: ${FIREBASE_PROJECT_ID}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: always
    datatype:
      datetime:
        write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# API documentation is always on: there is no production environment yet.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  paths-to-match: /api/**

app:
  mail:
    # LOG only writes e-mails to the log (local default); BREVO sends them (stage, prod).
    provider: ${MAIL_PROVIDER:LOG}
    # With Brevo the sender must be verified in the Brevo account (Senders).
    from-email: ${MAIL_FROM:no-reply@studioforyou.local}
    from-name: ${MAIL_FROM_NAME:STUDIO FOR YOU}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: https://api.brevo.com
