services:
  postgres:
    image: postgres:18-alpine
    container_name: zpi_postgres
    environment:
      # Inicjalizacja samej bazy danych na podstawie pliku .env
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: zpi_studio
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<version>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d zpi_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: zpi_backend
    ports:
      - "8080:8080"
    environment:
      # Wstrzykiwanie zmiennych do wnętrza kontenera Spring Boota
      # URL dla backendu to nazwa serwisu bazy z docker-compose ('postgres')
      # Profil dev włącza seed danych testowych (db/seed)
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zpi_studio
      SPRING_DATASOURCE_USERNAME: ${LOCAL_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD}
      # Firebase project whose ID tokens the backend accepts
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      # E-mail: LOG (default) only logs e-mails, BREVO sends them with BREVO_API_KEY
      MAIL_PROVIDER: ${MAIL_PROVIDER:-LOG}
      MAIL_FROM: ${MAIL_FROM:-no-reply@studioforyou.local}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Page that opens invitation links (web panel)
      INVITATION_LINK_BASE_URL: ${INVITATION_LINK_BASE_URL:-https://studioforyou-dev.web.app/invite}
      # Firebase Admin SDK key (accepting invitations): put the key file at ./secrets/firebase-admin.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: